services:
  postgres:
    image: postgres:16
    container_name: luca_webapp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: luca_webapp_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luca_webapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    container_name: luca_webapp_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: luca_webapp_dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PHX_HOST: localhost
      PHX_SERVER_IP: "0.0.0.0"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    secrets:
      - postgres_password
    command: mix phx.server

  app_prod:
    build:
      context: .
      target: prod
    container_name: luca_webapp_app_prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_DB: luca_webapp_dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_BASE: dev_secret_key_base_change_me
    ports:
      - "4000:4000"
    secrets:
      - postgres_password
    profiles:
      - prod

volumes:
  pg_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
